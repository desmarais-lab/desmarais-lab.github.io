<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLSC 508 Quiz 09/29 Answers</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.5rem; border-bottom: 3px solid #1E407C; padding-bottom: .4rem; }
  input { padding: .45rem; font-size: 1rem; width: 240px; font-family: inherit; }
  button { background: #1E407C; color: #fff; border: 0; padding: .5rem 1.2rem; font-size: 1rem; cursor: pointer; margin-left: .4rem; }
  #err { color: #a11; font-weight: bold; margin-top: .6rem; }
  .quiz h2 { font-size: 1.15rem; color: #1E407C; margin-top: 1.6rem; }
  .item { margin: .7rem 0; }
  .ans { font-weight: bold; }
</style>
</head>
<body>
<h1>PLSC 508 &mdash; Quiz Answers, 09/29</h1>
<p>Enter the passcode announced in class.</p>
<form id="f"><input type="password" id="pc" autocomplete="off" placeholder="passcode">
<button type="submit">Unlock</button></form>
<div id="err"></div>
<div id="out"></div>
<script>
const BLOB = {"salt": "L+yyKDxbwOXWwINMFoMN/Q==", "iv": "12thsq04u3qmJNEP", "ct": "XVThfTQbL9CoBpqwxpP1p2IZkoTs1PLHWVfjeP3k10Fhl7BBF59e6qlbbM5Cv1/2VBkJxv6dC1jpE/obdXzaGv1ckZwKPs4zdPYP/hsOr11yl/yc0OmpdYJWGdGiW+4hSeZkFb/pmFrxXHVGbeGjfyU7TVZAd0UbXCT6t80b15EKLXcKynufHfvH/a7AzDoPVekM+HMFeIy97JZeu5mMgLXWMZqkT2qodq8sbpjxMzQ2EEd8mySsAyekPnULLM88syHhA6XghWaFvdv/8t8=", "iters": 200000};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = document.getElementById("err"); err.textContent = "";
  const pc = document.getElementById("pc").value.trim();
  try {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pc), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(BLOB.salt), iterations: BLOB.iters, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BLOB.iv) }, key, b64(BLOB.ct));
    const data = JSON.parse(new TextDecoder().decode(pt));
    let h = "";
    for (const qz of data.quizzes) {
      h += '<div class="quiz"><h2>' + qz.title + "</h2>";
      for (const it of qz.items)
        h += '<div class="item">Question ' + it.q + ': <span class="ans">(' + it.answer + ')</span> &mdash; ' + it.why + "</div>";
      h += "</div>";
    }
    document.getElementById("out").innerHTML = h;
  } catch (e) {
    err.textContent = "Incorrect passcode.";
  }
});
</script>
</body>
</html>
