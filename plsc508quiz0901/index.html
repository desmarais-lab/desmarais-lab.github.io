<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLSC 508 Quiz 09/01 Answers</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.5rem; border-bottom: 3px solid #1E407C; padding-bottom: .4rem; }
  input { padding: .45rem; font-size: 1rem; width: 240px; font-family: inherit; }
  button { background: #1E407C; color: #fff; border: 0; padding: .5rem 1.2rem; font-size: 1rem; cursor: pointer; margin-left: .4rem; }
  #err { color: #a11; font-weight: bold; margin-top: .6rem; }
  .quiz h2 { font-size: 1.15rem; color: #1E407C; margin-top: 1.6rem; }

</head>
<body>
<h1>PLSC 508 &mdash; Quiz Answers, 09/01</h1>
<p>Enter the passcode announced in class.</p>
<form id="f"><input type="password" id="pc" autocomplete="off" placeholder="passcode">
<button type="submit">Unlock</button></form>
<div id="err"></div>
<div id="out"></div>
<script>
const BLOB = {"salt": "bdgqkAGNDeoGCxPHzi1JOg==", "iv": "B01VlDqNk6XASr1y", "ct": "VS2mlvJbhePG7nceLDVCKiLdXWlr4ZxRmgoaEVvqRp7NiLSOT3+S9eod/pQbvt7NItd/KWvCdbfmA0StkpB4PxQoRyVkaEWunFHWSB1MdoPoZx+WJxWuAfMFWE6B7I5k3UImhMnphtbnmO5mYCqQ5LI6vePKpUJFTPD39+MrFXIGDnmdemgSftuVnW+vthUirdxwvLKzhCzKlnBFIY7C1siYDU4z1ZETJvOzN52vQXAxaCEWOM2kcN9stXmWjSWBcJuAuWjdZ50VmGowqvXW2/4GmTAI8VceZS3ixremyPKIHBjRXG2K79cI6DOBveLhioc4MqwRRkMfjakaBakiP/Szj1StkLnVSfmZl1ELybPRQxOGvGEmxUj9KoWe2KpxCktSIkbfbNpLjKmrJhHoLpKz+g+/uIk21KsyStDm4PRo+Deb519VqUwXtcblpCp+cu+5XM50vu2PMhukmPwgOIrZgt4f05Z3O3rTC9xhacEGJfIE2JxUvd1yFTgzitcKE0YTY7UGMEi/9/Pm7tV4u6QF2XbxTFyqSWvkyMNoIiyzFqHf6vc6IALvUlnelSbyJemayxz2Cb2K8j+/JFJhwxP2wVSwYLHrwdH0KraqDvqssDTPMpo7/JLQ+EJQJG8N56B+u8mU7QaryXPec06h0Gi29UXouwNByQ+RzyaRTJ2GUQfO+U9LSXOnu2z1ja7evLI2lFy254DYnUGgnVSIU/P6msBFVVswAAU69FqFgX/ZbYC1YwnzyTk7QLCmZLM4uBOfERq69hOuzdCO/7lUETdn0r3tLffDUYxEIX+Fl+USNL2BVZlCnj2c4k5g05ZGdmfMco5VBnm9fl/Vfm2c3aPI/5iNBhfQZNNu/fmqzC3QmUPW5P4SFngxSQ7SaT0p2xM53KA31X4g19HKEdtMSSEz/ykbI1b1fkE2LeV911GMjI7PiyZj0yY024vtCKsLuzkKlkZp5LFFoyNRCIB3i8d8k1jXeRIR/FmJgOVnliQyPD5rVf4mSLaJjMJ0bZ1+/SI=", "iters": 200000};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = document.getElementById("err"); err.textContent = "";
  const pc = document.getElementById("pc").value.trim();
  try {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pc), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(BLOB.salt), iterations: BLOB.iters, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BLOB.iv) }, key, b64(BLOB.ct));
    const data = JSON.parse(new TextDecoder().decode(pt));
    let h = "";
    for (const qz of data.quizzes) {
      h += '<div class="quiz"><h2>' + qz.title + "</h2>";
      for (const it of qz.items)
        h += '<div class="item">Question ' + it.q + ': <span class="ans">(' + it.answer + ')</span> &mdash; ' + it.why + "</div>";
      h += "</div>";
    }
    document.getElementById("out").innerHTML = h;
  } catch (e) {
    err.textContent = "Incorrect passcode.";
  }
});
</script>
</body>
</html>
